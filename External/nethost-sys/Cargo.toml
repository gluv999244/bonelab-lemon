[package]
name = "nethost-sys"
version = "0.6.3"
description = "FFI bindings for nethost."
readme = "README.md"
repository = "https://github.com/OpenByteDev/nethost-sys"
documentation = "https://docs.rs/nethost-sys"
license = "MIT"
authors = ["OpenByte <development.openbyte@gmail.com>"]
edition = "2021"
links = "nethost"
categories = ["no-std", "external-ffi-bindings"]
keywords = ["nethost", "dotnet", "bindings", "coreclr"]
build = "build/mod.rs"

[dependencies]
coreclr-hosting-shared = "0.1"

[build-dependencies]
build-target = "0.4"
cargo-emit = "0.2"

# betterlemon: the nuget download (reqwest/ring/zip/zstd) needs a host C compiler to build.
# Instead, point NETHOST_LIB_DIR at runtimes/linux-bionic-arm64/native from the
# runtime.linux-bionic-arm64.microsoft.netcore.dotnetapphost 8.0.6 nuget package.
# The feature is kept (as a no-op) because netcorehost enables it by default.
[features]
download-nuget = []
